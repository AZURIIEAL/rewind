name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Rewind.sln

      - name: Build
        run: dotnet build Rewind.sln -c Release --no-restore

      - name: Test
        run: dotnet test Rewind.sln -c Release --no-build

      # Tagged builds (v1.2.3) get that version; everything else packs the version in src/Directory.Build.props.
      - name: Pack
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"; fi
          for project in src/Rewind.Core src/Rewind.AspNetCore src/Rewind.Cli; do
            dotnet pack "$project" -c Release -o artifacts $VERSION_ARG
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  # Runs only for v* tags, and needs a NUGET_API_KEY repository secret.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
